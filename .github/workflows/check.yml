# The project's own checks, on every push and pull request. Nothing here is
# new: check.py, nav.py (report), ncx_playorder.py (report), a build, and
# epubcheck on the result. A red run means the tree is not fit to ship.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: structural QA
        run: python3 tools/check.py
      - name: source layout (tools/fmt.py)
        run: python3 tools/fmt.py --check
      - name: dkar chag is regenerated (tools/dkarchag.py)
        run: python3 tools/dkarchag.py --check
      - name: jump index is regenerated and every link opens with its landmark label (tools/jumps.py)
        run: python3 tools/jumps.py --check
      - name: navigation report (must find nothing to fix)
        run: |
          python3 tools/nav.py | tee nav.txt
          test "$(grep -cE '^ *(fillable|mismatched|unfillable): 0( |$)' nav.txt)" = 3
          grep -E "jump arrows point the wrong way: 0" nav.txt
          grep -E "need restamping: 0" nav.txt
      - name: playOrder is a clean sequence
        run: python3 tools/ncx_playorder.py | grep -q "0 playOrder values to change"
      - name: build
        run: tools/pack.sh --plain-title
      - name: epubcheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.1.0/epubcheck.jar build/Ka-Nying-Chos-spyod-1.1.epub
